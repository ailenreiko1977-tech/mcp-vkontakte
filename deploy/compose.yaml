name: mcp-vkontakte
services:
  caddy:
    image: caddy:2@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Run prepare_deployment.py first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 192m
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: ../.secrets/app.env
    volumes: ["app_data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000); c.request('GET','/health',headers={'Host':'${DOMAIN}'}); assert c.getresponse().status==200"]
      interval: 30s
      timeout: 5s
      retries: 3
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: ["start", "--import-realm"]
    restart: unless-stopped
    env_file: ../.secrets/keycloak.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${DOMAIN}/auth
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../.secrets/realm.json:/opt/keycloak/data/import/vk-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g
  postgres:
    image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    restart: unless-stopped
    env_file: ../.secrets/postgres.env
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  app_data:
  postgres_data:
  caddy_data:
  caddy_config:
