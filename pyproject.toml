[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-vkontakte"
version = "0.1.0"
description = "Multi-user VK MCP with browser approvals and evidence-based community comparison"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "mcp==1.30.0", "httpx==0.28.1", "starlette==0.52.1",
  "cryptography==47.0.0", "PyJWT[crypto]==2.15.1", "authlib==1.9.1",
  "jsonschema==4.26.0", "itsdangerous==2.2.0", "python-multipart==0.0.32",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
mcp-vkontakte = "vk_mcp.app:main"

[tool.setuptools.packages.find]
include = ["vk_mcp*"]

[tool.setuptools.package-data]
vk_mcp = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
